version: '3.8'

services:
  kundtjanst-mysql:
    image: mysql:8.0
    container_name: kundtjanst-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kundservice_booking
    volumes:
      - kundtjanst-mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-service:
    build: .
    container_name: kundtjanst-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://kundtjanst-mysql:3306/kundservice_booking
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      BOOKING_SERVICE_URL: http://booking-service:8080
    depends_on:
      kundtjanst-mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

volumes:
  kundtjanst-mysql-data:

networks:
  app-network:
    external: true
